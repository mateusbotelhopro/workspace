<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Variação 1 — Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --off: #F4F4F2;
  --black: #0A0A0B;
  --blue: #2438E8;
  --blue-light: #4F6BFF;
  --white: #FFFFFF;
  --gray: #8A8A92;
}

body {
  width: 1080px;
  height: 1350px;
  background: var(--black);
  font-family: 'Archivo', sans-serif;
  overflow: hidden;
}

.frame {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
  padding: 96px 84px 76px;
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 16px 32px;
  border-radius: 100px;
  border: 2px solid var(--black);
  background: var(--blue);
  color: var(--white);
  font-family: 'Archivo Black', sans-serif;
  text-transform: uppercase;
  font-size: 24px;
  letter-spacing: 0.04em;
  box-shadow: 5px 5px 0 var(--blue-light);
}

.middle { margin-top: 60px; }

.headline {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  text-transform: uppercase;
  font-size: 92px;
  line-height: 1.06;
  letter-spacing: 0.2px;
  color: var(--off);
}

.headline .hl { color: var(--blue-light); }

.sub {
  margin-top: 40px;
  font-size: 38px;
  font-weight: 500;
  line-height: 1.4;
  color: #C7CBD6;
  max-width: 820px;
}

.bottom {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.cta {
  display: inline-flex;
  align-self: flex-start;
  align-items: center;
  gap: 16px;
  padding: 28px 52px;
  border-radius: 100px;
  border: 2px solid var(--black);
  background: var(--blue);
  color: var(--white);
  font-family: 'Archivo Black', sans-serif;
  text-transform: uppercase;
  font-size: 34px;
  letter-spacing: 0.02em;
  box-shadow: 6px 6px 0 var(--blue-light);
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.12);
}

.brand img { height: 30px; width: auto; display: block; }

.brand .handle {
  font-family: 'Archivo', sans-serif;
  font-weight: 600;
  font-size: 24px;
  color: var(--gray);
}
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <span class="tag">Gestão de tráfego pago</span>
    </div>
    <div class="middle">
      <h1 class="headline">Cansado de esperar <span class="hl">indicação</span> pra fechar cliente?</h1>
      <p class="sub">Tráfego pago com previsibilidade, não com sorte.</p>
    </div>
    <div class="bottom">
      <span class="cta">Chama no WhatsApp</span>
      <div class="brand">
        <img src="file:///C:/Users/mateu/Desktop/BotelhoOS/marca/logo/logo-negativa.svg" alt="Mateus Botelho">
        <span class="handle">@botelho.ag</span>
      </div>
    </div>
  </div>
</body>
</html>
