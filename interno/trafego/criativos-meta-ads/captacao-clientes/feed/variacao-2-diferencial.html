<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Variação 2 — Feed</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --off: #F4F4F2;
  --black: #0A0A0B;
  --blue: #2438E8;
  --blue-light: #4F6BFF;
  --white: #FFFFFF;
  --gray-dark: #54545C;
}

body {
  width: 1080px;
  height: 1350px;
  background: var(--off);
  font-family: 'Archivo', sans-serif;
  overflow: hidden;
}

.frame {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 88px 84px 64px;
}

.tag {
  display: inline-flex;
  align-self: flex-start;
  align-items: center;
  padding: 16px 32px;
  border-radius: 100px;
  border: 2px solid var(--black);
  background: var(--blue);
  color: var(--white);
  font-family: 'Archivo Black', sans-serif;
  text-transform: uppercase;
  font-size: 24px;
  letter-spacing: 0.04em;
  box-shadow: 5px 5px 0 var(--black);
}

.headline {
  margin-top: 48px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  text-transform: uppercase;
  font-size: 68px;
  line-height: 1.08;
  letter-spacing: 0.2px;
  color: var(--black);
}

.headline .hl { color: var(--blue); }

.photo-wrap {
  position: relative;
  margin-top: 46px;
  border: 2px solid var(--black);
  border-radius: 20px;
  box-shadow: 6px 6px 0 var(--blue);
  overflow: hidden;
  height: 460px;
}

.photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 32%;
  display: block;
}

.photo-badge {
  position: absolute;
  bottom: 20px;
  left: 20px;
  padding: 14px 26px;
  border-radius: 100px;
  border: 2px solid var(--black);
  background: var(--off);
  color: var(--black);
  font-family: 'Archivo Black', sans-serif;
  text-transform: uppercase;
  font-size: 22px;
  letter-spacing: 0.03em;
  box-shadow: 4px 4px 0 var(--black);
}

.sub {
  margin-top: 40px;
  font-size: 32px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--gray-dark);
  max-width: 820px;
}

.bottom {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.cta {
  display: inline-flex;
  align-self: flex-start;
  align-items: center;
  gap: 16px;
  padding: 26px 50px;
  border-radius: 100px;
  border: 2px solid var(--black);
  background: var(--blue);
  color: var(--white);
  font-family: 'Archivo Black', sans-serif;
  text-transform: uppercase;
  font-size: 32px;
  letter-spacing: 0.02em;
  box-shadow: 6px 6px 0 var(--black);
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-top: 8px;
  border-top: 1px solid rgba(10,10,11,0.14);
}

.brand img { height: 30px; width: auto; display: block; }

.brand .handle {
  font-family: 'Archivo', sans-serif;
  font-weight: 600;
  font-size: 24px;
  color: var(--gray-dark);
}
</style>
</head>
<body>
  <div class="frame">
    <span class="tag">Gestão de tráfego pago</span>
    <h1 class="headline">Sua agência tem dono? Ou só tem <span class="hl">estagiário</span>?</h1>
    <div class="photo-wrap">
      <img src="file:///C:/Users/mateu/Desktop/BotelhoOS/marca/fotos/mateus-botelho-frontal.jpeg" alt="Mateus Botelho">
      <span class="photo-badge">Gestão 100% direta</span>
    </div>
    <p class="sub">Google Ads e Meta Ads, sem CS de plantão.</p>
    <div class="bottom">
      <span class="cta">Chama no WhatsApp</span>
      <div class="brand">
        <img src="file:///C:/Users/mateu/Desktop/BotelhoOS/marca/logo/logo-positiva.svg" alt="Mateus Botelho">
        <span class="handle">@botelho.ag</span>
      </div>
    </div>
  </div>
</body>
</html>
