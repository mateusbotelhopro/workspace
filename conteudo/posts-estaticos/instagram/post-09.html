<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Post 09</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(229, 9, 20, 0.14) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 50% 90%, rgba(229, 9, 20, 0.08) 0%, transparent 60%),
      linear-gradient(180deg, #0d0808 0%, #0A0A0A 50%, #080606 100%);
  }

  .border-frame {
    position: absolute;
    top: 40px;
    left: 40px;
    right: 40px;
    bottom: 40px;
    border: 1px solid rgba(229, 9, 20, 0.15);
    border-radius: 20px;
    pointer-events: none;
  }

  .corner-tl, .corner-br {
    position: absolute;
    width: 24px;
    height: 24px;
  }

  .corner-tl {
    top: -1px;
    left: -1px;
    border-top: 3px solid #E50914;
    border-left: 3px solid #E50914;
    border-radius: 20px 0 0 0;
  }

  .corner-br {
    bottom: -1px;
    right: -1px;
    border-bottom: 3px solid #E50914;
    border-right: 3px solid #E50914;
    border-radius: 0 0 20px 0;
  }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 0 80px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: 100px;
    background: rgba(229, 9, 20, 0.12);
    border: 1px solid rgba(229, 9, 20, 0.3);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #E50914;
  }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 100px;
    font-weight: 400;
    line-height: 0.98;
    letter-spacing: 3px;
    color: #FFFFFF;
    text-transform: uppercase;
  }

  .headline em {
    font-style: normal;
    color: #E50914;
  }

  .divider { display: none; }

  .sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
  }

  .bottom-text {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.5px;
  }

  .handle {
    position: absolute;
    bottom: 56px;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.25);
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="border-frame">
    <div class="corner-tl"></div>
    <div class="corner-br"></div>
  </div>

  <div class="content">
    <span class="badge">Análise gratuita</span>
    <h1 class="headline">
      Eu olho suas<br>
      campanhas e te<br>
      mostro <em>onde o<br>
      dinheiro está<br>
      vazando</em>.
    </h1>
    <div class="divider"></div>
    <p class="sub">
      Sem compromisso.<br>
      Sem enrolação.
    </p>
  </div>

  <span class="handle">@mateusbotelhopro</span>
</body>
</html>
