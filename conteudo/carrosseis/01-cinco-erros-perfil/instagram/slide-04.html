<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#F4F4F2; --ink:#0A0A0B; --blue:#2438E8; --white:#fff; --gray:#54545C; }
  html,body{ width:1080px; height:1350px; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',sans-serif; padding:80px 76px;
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .head{ display:flex; align-items:center; gap:20px; margin-bottom:44px; }
  .erro-pill{
    display:inline-flex; align-items:center;
    border:2px solid var(--ink); border-radius:100px; padding:11px 24px;
    background:var(--blue); color:var(--white); box-shadow:5px 5px 0 var(--ink);
    font-family:'Archivo Black',sans-serif; font-size:20px;
    text-transform:uppercase; letter-spacing:1.5px;
  }
  .head .line{ flex:1; height:2px; background:var(--ink); }
  h2{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
    font-size:70px; line-height:1.04; letter-spacing:-1px;
    text-transform:uppercase; max-width:920px; margin-bottom:52px;
  }
  .card{
    border:2px solid var(--ink); border-radius:20px; background:var(--white);
    box-shadow:8px 8px 0 var(--blue); padding:52px 48px;
  }
  .card p{ font-size:41px; line-height:1.42; color:var(--ink); font-weight:500; }
  .card b{ font-weight:800; }
  .card .q{ font-family:'Playfair Display',serif; font-style:italic; color:var(--blue); }
  .spacer{ flex:1; }
  .foot{ display:flex; justify-content:space-between; align-items:flex-end; }
  .brand{ font-family:'Archivo Black',sans-serif; font-size:18px; letter-spacing:.5px; text-transform:uppercase; color:var(--gray); }
  .count{ font-family:'Archivo Black',sans-serif; font-size:20px; color:var(--gray); }
  .progress{ position:absolute; left:0; bottom:0; height:6px; width:44.4%; background:var(--blue); }
</style>
</head>
<body>
  <div class="head">
    <span class="erro-pill">Erro 02</span>
    <span class="line"></span>
  </div>
  <h2>Nenhum sinal de confiança</h2>
  <div class="card">
    <p>Sem rosto, sem um caso explicado, sem uma dúvida real respondida. Cliente jurídico não compra serviço, ele compra a <b>segurança de estar em boas mãos</b>. Se o perfil não mostra por que confiar, <span class="q">o silêncio decide por ele.</span></p>
  </div>
  <div class="spacer"></div>
  <div class="foot">
    <span class="brand">Botelho · Marketing Jurídico</span>
    <span class="count">04 / 09</span>
  </div>
  <div class="progress"></div>
</body>
</html>
