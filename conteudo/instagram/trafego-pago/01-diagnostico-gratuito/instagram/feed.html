<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#F4F4F2; --ink:#0A0A0B; --blue:#2438E8; --white:#fff; --gray:#54545C; }
  html,body{ width:1080px; height:1350px; }
  body{ background:var(--bg); color:var(--ink); font-family:'Archivo',sans-serif;
    padding:80px 76px; position:relative; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
  .top{ display:flex; align-items:center; gap:14px; }
  .brand-pill{ display:inline-flex; align-items:center; gap:10px; border:2px solid var(--ink); border-radius:100px;
    padding:12px 22px; background:var(--white); box-shadow:5px 5px 0 var(--ink);
    font-family:'Archivo Black',sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:.5px; }
  .dot{ width:14px; height:14px; border-radius:50%; background:var(--blue); }
  .center{ margin-top:auto; margin-bottom:auto; }
  .kicker{ font-family:'Archivo Black',sans-serif; font-size:24px; text-transform:uppercase; letter-spacing:2px; color:var(--blue); margin-bottom:26px; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:98px; line-height:.98; letter-spacing:-2px; text-transform:uppercase; max-width:880px; }
  h1 em{ font-style:normal; color:var(--blue); }
  .sub{ margin-top:32px; font-size:36px; line-height:1.35; font-weight:600; max-width:820px; color:var(--ink); }
  .cta-btn{ margin-top:44px; display:inline-flex; align-items:center; gap:16px; background:var(--blue); color:var(--white);
    border:2px solid var(--ink); border-radius:100px; box-shadow:6px 6px 0 var(--ink);
    padding:24px 40px; font-family:'Archivo Black',sans-serif; font-size:26px; text-transform:uppercase; letter-spacing:1px; }
  .bottom{ display:flex; align-items:flex-end; justify-content:space-between; }
  .brand{ font-family:'Archivo Black',sans-serif; font-size:18px; letter-spacing:.5px; text-transform:uppercase; color:var(--gray); }
</style>
</head>
<body>
  <div class="top"><span class="brand-pill"><span class="dot"></span>Botelho · Marketing Jurídico</span></div>
  <div class="center">
    <div class="kicker">Diagnóstico gratuito</div>
    <h1>Seu escritório <em>ainda</em> depende só de indicação?</h1>
    <p class="sub">Analiso seu Google, Instagram e captação de graça e mostro o que está travando a chegada de cliente novo.</p>
    <span class="cta-btn">Quero o diagnóstico →</span>
  </div>
  <div class="bottom">
    <span class="brand">@botelho.ag</span>
    <span class="brand">Botelho Marketing Jurídico</span>
  </div>
</body>
</html>
