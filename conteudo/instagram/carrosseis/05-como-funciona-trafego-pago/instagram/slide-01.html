<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#F4F4F2; --ink:#0A0A0B; --blue:#2438E8; --white:#fff; --gray:#54545C; }
  html,body{ width:1080px; height:1350px; }
  body{ background:var(--bg); color:var(--ink); font-family:'Archivo',sans-serif;
    padding:80px 76px; position:relative; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; }
  .top{ display:flex; align-items:center; gap:14px; }
  .brand-pill{ display:inline-flex; align-items:center; gap:10px; border:2px solid var(--ink); border-radius:100px;
    padding:12px 22px; background:var(--white); box-shadow:5px 5px 0 var(--ink);
    font-family:'Archivo Black',sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:.5px; }
  .dot{ width:14px; height:14px; border-radius:50%; background:var(--blue); }
  .center{ margin-top:auto; margin-bottom:auto; }
  .kicker{ font-family:'Archivo Black',sans-serif; font-size:24px; text-transform:uppercase; letter-spacing:2px; color:var(--blue); margin-bottom:26px; }
  h1{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:74px; line-height:1.06; letter-spacing:-1.5px; text-transform:uppercase; }
  h1 em{ font-style:normal; color:var(--blue); }
  .sub{ margin-top:36px; font-size:40px; line-height:1.3; font-weight:600; max-width:880px; }
  .bottom{ display:flex; align-items:flex-end; justify-content:space-between; }
  .swipe{ display:inline-flex; align-items:center; gap:14px; font-family:'Archivo Black',sans-serif; font-size:20px; text-transform:uppercase; letter-spacing:1px; }
  .swipe .arrow{ width:56px; height:56px; border-radius:50%; background:var(--blue); border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink); display:flex; align-items:center; justify-content:center; color:var(--white); font-size:26px; }
  .count{ font-family:'Archivo Black',sans-serif; font-size:20px; color:var(--gray); }
  .progress{ position:absolute; left:0; bottom:0; height:6px; width:12.5%; background:var(--blue); }
</style>
</head>
<body>
  <div class="top"><span class="brand-pill"><span class="dot"></span>Botelho · Marketing Jurídico</span></div>
  <div class="center">
    <div class="kicker">Tráfego pago pra advogado</div>
    <h1>Tráfego pra escritório não é <em>impulsionar</em> post</h1>
    <p class="sub">É colocar seu nome na frente de quem já tá procurando um advogado.</p>
  </div>
  <div class="bottom">
    <span class="swipe"><span class="arrow">→</span> Arrasta</span>
    <span class="count">01 / 08</span>
  </div>
  <div class="progress"></div>
</body>
</html>
