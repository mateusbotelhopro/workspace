<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#0A0A0B; --blue:#2438E8; --blue-l:#4F6BFF; --white:#fff; }
  html,body{ width:1080px; height:1350px; }
  body{ background:var(--ink); color:var(--white); font-family:'Archivo',sans-serif;
    padding:80px 76px; display:flex; flex-direction:column; position:relative; overflow:hidden; }
  .label{ align-self:flex-start; display:inline-flex; align-items:center; border:2px solid var(--white); border-radius:100px;
    padding:11px 24px; font-family:'Archivo Black',sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:1.5px; }
  h2{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:52px; line-height:1.1; letter-spacing:-1px; text-transform:uppercase; margin:32px 0 36px; }
  .card{ border:2px solid var(--blue-l); border-radius:20px; background:rgba(255,255,255,0.04); padding:44px 42px; box-shadow:6px 6px 0 var(--blue); }
  .card p{ font-size:34px; line-height:1.45; font-weight:500; }
  .card b{ font-weight:800; color:var(--blue-l); }
  .spacer{ flex:1; }
  .foot{ display:flex; justify-content:space-between; align-items:flex-end; }
  .brand{ font-family:'Archivo Black',sans-serif; font-size:18px; letter-spacing:.5px; text-transform:uppercase; opacity:.55; }
  .count{ font-family:'Archivo Black',sans-serif; font-size:20px; opacity:.55; }
  .progress{ position:absolute; left:0; bottom:0; height:6px; width:85.7%; background:var(--blue); }
</style>
</head>
<body>
  <span class="label">Exemplo pra ilustrar</span>
  <h2>Juntando as três contas</h2>
  <div class="card">
    <p>Ticket médio de <b>R$3.000</b>, taxa de fechamento de <b>1 em cada 5 leads</b>: cada lead vale até <b>R$600</b> pra você.<br><br>Custo por lead em R$150? Sobra margem real. Acima de R$600? Você paga pra ter prejuízo, mesmo trazendo cliente.</p>
  </div>
  <div class="spacer"></div>
  <div class="foot">
    <span class="brand">Botelho · Marketing Jurídico</span>
    <span class="count">06 / 07</span>
  </div>
  <div class="progress"></div>
</body>
</html>
