<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#F4F4F2; --ink:#0A0A0B; --blue:#2438E8; --white:#fff; --gray:#54545C; }
  html,body{ width:1080px; height:1350px; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Archivo',sans-serif; padding:80px 76px;
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .erro-pill{
    align-self:flex-start; display:inline-flex; align-items:center;
    border:2px solid var(--ink); border-radius:100px; padding:11px 24px;
    background:var(--blue); color:var(--white); box-shadow:5px 5px 0 var(--ink);
    font-family:'Archivo Black',sans-serif; font-size:20px;
    text-transform:uppercase; letter-spacing:1.5px;
  }
  .num{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
    font-size:300px; line-height:.8; color:var(--blue);
    letter-spacing:-6px; margin:18px 0 6px -8px;
  }
  h2{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
    font-size:64px; line-height:1.05; letter-spacing:-1px;
    text-transform:uppercase; max-width:900px;
  }
  .desc{ margin-top:32px; font-size:39px; line-height:1.4; color:var(--gray); font-weight:500; max-width:920px; }
  .desc b{ color:var(--ink); font-weight:800; }
  .spacer{ flex:1; }
  .foot{ display:flex; justify-content:space-between; align-items:flex-end; }
  .brand{ font-family:'Archivo Black',sans-serif; font-size:18px; letter-spacing:.5px; text-transform:uppercase; color:var(--gray); }
  .count{ font-family:'Archivo Black',sans-serif; font-size:20px; color:var(--gray); }
  .progress{ position:absolute; left:0; bottom:0; height:6px; width:55.5%; background:var(--blue); }
</style>
</head>
<body>
  <span class="erro-pill">Erro 03</span>
  <div class="num">03</div>
  <h2>O último post é de três meses atrás</h2>
  <p class="desc">Perfil parado passa a mesma sensação de <b>escritório de porta fechada</b>. O cliente pensa "será que ainda atende?" e nem chega a perguntar. Não precisa postar todo dia. Precisa não parecer abandonado.</p>
  <div class="spacer"></div>
  <div class="foot">
    <span class="brand">Botelho · Marketing Jurídico</span>
    <span class="count">05 / 09</span>
  </div>
  <div class="progress"></div>
</body>
</html>
