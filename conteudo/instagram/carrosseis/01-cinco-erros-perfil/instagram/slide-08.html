<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --blue:#2438E8; --ink:#0A0A0B; --white:#fff; }
  html,body{ width:1080px; height:1350px; }
  body{
    background:var(--blue); color:var(--white);
    font-family:'Archivo',sans-serif; padding:80px 76px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
  }
  .tag{
    align-self:flex-start;
    border:2px solid var(--white); border-radius:100px; padding:11px 24px;
    font-family:'Archivo Black',sans-serif; font-size:20px;
    text-transform:uppercase; letter-spacing:2px;
  }
  .mid{ margin-top:auto; margin-bottom:auto; }
  .mid p{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
    font-size:68px; line-height:1.1; letter-spacing:-1px;
  }
  .mid .hl{ background:var(--ink); padding:2px 14px; border-radius:8px; }
  .mid .serif{ font-family:'Playfair Display',serif; font-style:italic; font-weight:400; }
  .foot{ display:flex; justify-content:space-between; align-items:flex-end; }
  .brand{ font-family:'Archivo Black',sans-serif; font-size:18px; letter-spacing:.5px; text-transform:uppercase; opacity:.7; }
  .count{ font-family:'Archivo Black',sans-serif; font-size:20px; opacity:.7; }
  .progress{ position:absolute; left:0; bottom:0; height:6px; width:88.8%; background:var(--ink); }
</style>
</head>
<body>
  <span class="tag">A virada</span>
  <div class="mid">
    <p>Nenhum desses erros é sobre <span class="serif">postar mais.</span><br><br>É sobre quem chega no seu perfil entender em <span class="hl">cinco segundos</span> o que você resolve e por que confiar.</p>
  </div>
  <div class="foot">
    <span class="brand">Botelho · Marketing Jurídico</span>
    <span class="count">08 / 09</span>
  </div>
  <div class="progress"></div>
</body>
</html>
