<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --ink:#0A0A0B; --blue:#2438E8; --blue-l:#4F6BFF; --white:#fff; }
  html,body{ width:1080px; height:1350px; }
  body{ background:var(--ink); color:var(--white); font-family:'Archivo',sans-serif;
    padding:80px 76px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
  .top{ display:flex; align-items:center; gap:14px; }
  .brand-pill{ display:inline-flex; align-items:center; gap:10px; border:2px solid var(--white); border-radius:100px;
    padding:12px 22px; font-family:'Archivo Black',sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:.5px; }
  .dot{ width:14px; height:14px; border-radius:50%; background:var(--blue-l); }
  .mid{ margin-top:auto; margin-bottom:auto; }
  h2{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:62px; line-height:1.1; letter-spacing:-1.5px; text-transform:uppercase; }
  h2 em{ font-style:normal; color:var(--blue-l); }
  .desc{ margin-top:34px; font-size:37px; line-height:1.42; font-weight:500; max-width:900px; opacity:.9; }
  .cta-btn{ margin-top:52px; display:inline-flex; align-items:center; gap:16px; background:var(--blue); color:var(--white);
    border:2px solid var(--white); border-radius:100px; box-shadow:6px 6px 0 var(--blue-l);
    padding:26px 46px; font-family:'Archivo Black',sans-serif; font-size:27px; text-transform:uppercase; letter-spacing:1px; }
  .foot{ display:flex; justify-content:space-between; align-items:flex-end; }
  .brand{ font-family:'Archivo Black',sans-serif; font-size:18px; letter-spacing:.5px; text-transform:uppercase; opacity:.55; }
  .count{ font-family:'Archivo Black',sans-serif; font-size:20px; opacity:.55; }
  .progress{ position:absolute; left:0; bottom:0; height:6px; width:100%; background:var(--blue); }
</style>
</head>
<body>
  <div class="top"><span class="brand-pill"><span class="dot"></span>Botelho · Marketing Jurídico</span></div>
  <div class="mid">
    <h2>Testa agora. <em>Sua área + sua cidade.</em></h2>
    <p class="desc">Abre o Google e pesquisa sua área de atuação mais sua cidade. Você aparece nos primeiros resultados?</p>
    <span class="cta-btn">Testa e comenta →</span>
  </div>
  <div class="foot">
    <span class="brand">@botelho.ag</span>
    <span class="count">05 / 05</span>
  </div>
  <div class="progress"></div>
</body>
</html>
