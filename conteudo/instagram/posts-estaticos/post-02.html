<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Post 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    background: #070809;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 72px 80px;
    position: relative;
    overflow: hidden;
  }

  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 80% 20%, rgba(229, 9, 20, 0.18) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 10% 80%, rgba(229, 9, 20, 0.10) 0%, transparent 60%),
      linear-gradient(160deg, #0c0c0c 0%, #0A0A0A 40%, #0f0808 100%);
  }

  .grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 20%, transparent 80%);
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 20%, transparent 80%);
  }

  .accent-bar { display: none; }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 40px;
    padding-left: 12px;
  }

  .tag { display: none; }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 96px;
    font-weight: 400;
    line-height: 1.0;
    letter-spacing: 2px;
    color: #FFFFFF;
    text-transform: uppercase;
  }

  .headline em {
    font-style: normal;
    color: #E50914;
  }

  .divider { display: none; }

  .subtext {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 74px;
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: 1.5px;
    color: rgba(255, 255, 255, 0.45);
    text-transform: uppercase;
  }

  .subtext em {
    font-style: normal;
    color: rgba(255, 255, 255, 0.85);
  }

  .handle {
    position: absolute;
    bottom: 28px;
    right: 72px;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 0.5px;
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="grid-lines"></div>
  <div class="accent-bar"></div>

  <div class="content">
    <span class="tag">Topo de funil</span>
    <h1 class="headline">
      Seu concorrente<br>
      <em>não é melhor</em><br>
      que você.
    </h1>
    <div class="divider"></div>
    <p class="subtext">
      Ele só sabe <em>de onde<br>
      vêm os clientes</em> dele.
    </p>
  </div>

  <span class="handle">@botelho.ag</span>
</body>
</html>
