<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Post 05</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    filter: brightness(0.3) saturate(0.6);
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(10, 10, 10, 0.4) 0%,
      rgba(10, 10, 10, 0.55) 30%,
      rgba(10, 10, 10, 0.85) 60%,
      rgba(10, 10, 10, 0.97) 100%
    );
  }

  .red-glow {
    position: absolute;
    bottom: 15%;
    left: -10%;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(229, 9, 20, 0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .content {
    position: absolute;
    bottom: 80px;
    left: 72px;
    right: 72px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .tag { display: none; }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 102px;
    font-weight: 400;
    line-height: 0.98;
    letter-spacing: 2px;
    color: #FFFFFF;
    text-transform: uppercase;
  }

  .headline em {
    font-style: normal;
    color: #E50914;
  }

  .sub {
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.5);
    max-width: 700px;
  }

  .handle {
    position: absolute;
    bottom: 28px;
    right: 72px;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.25);
    z-index: 5;
  }

  .bottom-line { display: none; }
</style>
</head>
<body>
  <img src="../imagens/meeting.jpg" alt="" class="bg-image">
  <div class="overlay"></div>
  <div class="red-glow"></div>

  <div class="content">
    <span class="tag">Meio de funil</span>
    <h1 class="headline">
      Lead que não<br>
      vira cliente<br>
      é <em>custo</em>,<br>
      não resultado.
    </h1>
    <p class="sub">Gerar lead é metade do trabalho.<br>A outra metade ninguém quer falar.</p>
  </div>

  <span class="handle">@mateusbotelhopro</span>
  <div class="bottom-line"></div>
</body>
</html>
