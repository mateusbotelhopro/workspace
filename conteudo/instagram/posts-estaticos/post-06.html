<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Post 06</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .bg-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(0.25) saturate(0.4);
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(10, 10, 10, 0.5) 0%,
      rgba(10, 10, 10, 0.6) 35%,
      rgba(10, 10, 10, 0.9) 65%,
      rgba(10, 10, 10, 0.98) 100%
    );
  }

  .content {
    position: absolute;
    bottom: 80px;
    left: 72px;
    right: 72px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .tag { display: none; }

  .block-top {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .headline {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 86px;
    font-weight: 400;
    line-height: 1.0;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.45);
    text-transform: uppercase;
  }

  .headline em {
    font-style: normal;
    color: #FFFFFF;
  }

  .divider { display: none; }

  .headline-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 92px;
    font-weight: 400;
    line-height: 1.0;
    letter-spacing: 2px;
    color: #FFFFFF;
    text-transform: uppercase;
  }

  .headline-main em {
    font-style: normal;
    color: #E50914;
  }

  .handle {
    position: absolute;
    bottom: 28px;
    right: 72px;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.25);
    z-index: 5;
  }

  .accent-bar { display: none; }
</style>
</head>
<body>
  <img src="../imagens/money.jpg" alt="" class="bg-image">
  <div class="overlay"></div>
  <div class="accent-bar"></div>

  <div class="content">
    <span class="tag">Meio de funil</span>
    <div class="block-top">
      <h1 class="headline">
        Não é sobre<br>
        <em>gastar mais</em><br>
        em anúncio.
      </h1>
    </div>
    <div class="divider"></div>
    <p class="headline-main">
      É sobre <em>parar de<br>
      desperdiçar</em> o que<br>
      já gasta.
    </p>
  </div>

  <span class="handle">@mateusbotelhopro</span>
</body>
</html>
