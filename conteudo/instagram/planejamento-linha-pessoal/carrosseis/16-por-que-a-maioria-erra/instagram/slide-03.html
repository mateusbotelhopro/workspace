<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#F4F4F2;font-family:'Archivo',sans-serif;position:relative;overflow:hidden}
.content{padding:100px 56px 0;height:100%}
.tag{display:inline-flex;align-self:flex-start;background:#0A0A0B;border-radius:100px;padding:10px 24px;font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;color:#FFF;margin-bottom:32px}
.title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:52px;line-height:1.1;color:#0A0A0B;text-transform:uppercase;max-width:900px;margin-bottom:36px}
.card{border:2px solid #0A0A0B;border-radius:20px;background:#FFFFFF;box-shadow:6px 6px 0 #2438E8;padding:48px 44px}
.body-text{font-family:'Archivo',sans-serif;font-weight:500;font-size:36px;line-height:1.45;color:#0A0A0B}
.progress{position:absolute;bottom:0;left:0;height:3px;width:49.98%;background:#2438E8}
</style></head><body>
<div class="content">
<div class="tag">crença 1</div>
<div class="title">Achar que marketing é postar bonito</div>
<div class="card">
<div class="body-text">Um feed organizado ajuda a passar confiança, mas não gera contato sozinho. Ele funciona como vitrine, não como porta de entrada. Sem um caminho claro do post até o direct, o escritório publica bonito e continua esperando o telefone tocar por indicação.</div>
</div>
</div>
<div class="progress"></div>
</body></html>
