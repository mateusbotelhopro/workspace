<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

<div class="content">
<div class="num">02</div>
<div class="body-text">
<p>Todo mês aparece uma fórmula nova prometendo fazer o telefone tocar. Geralmente vem de quem nunca fechou uma campanha de verdade pra advogado.</p>
<p>Na prática, os erros que mais vejo se repetem e não têm nada de mistério.</p>
</div>
</div>
<div class="progress"></div>
