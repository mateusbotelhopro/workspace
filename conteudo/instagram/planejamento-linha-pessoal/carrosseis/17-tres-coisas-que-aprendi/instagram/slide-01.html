<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#F4F4F2;font-family:'Archivo',sans-serif;position:relative;overflow:hidden}
.content{padding:96px 56px 0;display:flex;flex-direction:column;height:100%}
.tag{display:inline-flex;align-self:flex-start;background:#2438E8;border:2px solid #0A0A0B;border-radius:100px;padding:10px 24px;font-family:'Archivo Black',sans-serif;font-size:22px;text-transform:uppercase;color:#FFF;box-shadow:4px 4px 0 #0A0A0B;margin-bottom:48px}
.headline{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:70px;line-height:1.08;color:#0A0A0B;text-transform:uppercase;max-width:920px;margin-bottom:36px}
.sub{font-family:'Archivo',sans-serif;font-weight:500;font-size:38px;line-height:1.4;color:#54545C;max-width:820px}
.progress{position:absolute;bottom:0;left:0;height:3px;width:16.66%;background:#2438E8}
</style></head><body>
<div class="content">
<div class="tag">trajetória</div>
<div class="headline">3 coisas que aprendi trabalhando só com advogados</div>
<div class="sub">Padrão que se repete escritório após escritório, independente do tamanho ou da área de atuação.</div>
</div>
<div class="progress"></div>
</body></html>
