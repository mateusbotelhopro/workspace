<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    font-family: 'Archivo', sans-serif;
    overflow: hidden;
  }
  .capa-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
  }
  .capa-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(10,10,11,0.05) 0%,
      rgba(10,10,11,0.35) 45%,
      rgba(10,10,11,0.92) 100%
    );
  }
  .capa-content {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 56px 56px 80px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    background: #2438E8;
    border: 2px solid #0A0A0B;
    border-radius: 100px;
    padding: 10px 24px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #FFFFFF;
    box-shadow: 4px 4px 0 #0A0A0B;
    margin-bottom: 32px;
  }
  .headline {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: 96px;
    line-height: 1.02;
    color: #FFFFFF;
    text-transform: uppercase;
    margin-bottom: 28px;
    max-width: 900px;
  }
  .subtext {
    font-family: 'Archivo', sans-serif;
    font-weight: 500;
    font-size: 38px;
    line-height: 1.35;
    color: #F4F4F2;
    max-width: 820px;
    margin-bottom: 56px;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    width: 160px;
  }
  .handle {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: #F4F4F2;
  }
</style>
</head>
<body>
  <img class="capa-bg" src="../imagens/mateus-frontal.jpeg" alt="Mateus Botelho">
  <div class="capa-overlay"></div>
  <div class="capa-content">
    <div class="tag">quem eu sou</div>
    <div class="headline">Eu sou o<br>Mateus.</div>
    <div class="subtext">Ajudo escritório de advocacia a parar de depender só de indicação.</div>
    <div class="footer">
      <img class="logo" src="file:///c:/Users/mateu/Desktop/BotelhoOS/marca/logo/logo-negativa.svg" alt="Mateus Botelho">
      <div class="handle">@mateusbotelhopro</div>
    </div>
  </div>
</body>
</html>
