<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#F4F4F2;font-family:'Archivo',sans-serif;position:relative;overflow:hidden}
.content{padding:120px 56px 0;height:100%}
.card{border:2px solid #0A0A0B;border-radius:20px;background:#FFFFFF;box-shadow:6px 6px 0 #2438E8;padding:56px 48px}
.label{font-family:'Archivo Black',sans-serif;font-size:24px;text-transform:uppercase;color:#2438E8;margin-bottom:28px}
.body-text{font-family:'Archivo',sans-serif;font-weight:500;font-size:40px;line-height:1.45;color:#0A0A0B}
.body-text p{margin-bottom:32px}
.progress{position:absolute;bottom:0;left:0;height:3px;width:42.84%;background:#2438E8}
</style></head><body>
<div class="content">
<div class="card">
<div class="label">manhã</div>
<div class="body-text">
<p>O dia começa com uma rodada pelas contas de anúncio, uma por uma. Não é só olhar o gasto do dia. É comparar o custo por lead de hoje com a média dos últimos sete dias, escritório por escritório.</p>
<p>Se um número sai da curva, a campanha é ajustada ali mesmo.</p>
</div>
</div>
</div>
<div class="progress"></div>
</body></html>
