<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#F4F4F2;font-family:'Archivo',sans-serif;position:relative;overflow:hidden}
.content{padding:120px 56px 0;display:flex;flex-direction:column;height:100%}
.num{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:56px;color:#2438E8;margin-bottom:40px}
.body-text{font-family:'Archivo',sans-serif;font-weight:500;font-size:44px;line-height:1.45;color:#0A0A0B;max-width:900px}
.body-text p{margin-bottom:36px}
.progress{position:absolute;bottom:0;left:0;height:3px;width:28.56%;background:#2438E8}
</style></head><body>
<div class="content">
<div class="num">02</div>
<div class="body-text">
<p>Advogado costuma imaginar uma agência como uma sala cheia de gente: atendimento, analista, redator, cada um cuidando de uma parte da campanha antes dela chegar no cliente.</p>
<p>Comigo esse caminho não existe. Quem recebe a demanda, monta o anúncio e acompanha o resultado é a mesma pessoa.</p>
</div>
</div>
<div class="progress"></div>
</body></html>
