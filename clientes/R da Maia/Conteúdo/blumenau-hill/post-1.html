<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0e0e0e;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
  }

  .fade-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 260px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }

  .fade-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 780px;
    background: linear-gradient(to bottom, rgba(14,14,14,0) 0%, rgba(14,14,14,0.75) 40%, rgba(14,14,14,0.97) 75%, #0e0e0e 100%);
  }

  .tag {
    position: absolute;
    top: 72px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .tag .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #A49074;
  }

  .tag span {
    color: #F2EEE7;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .headline {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 372px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 84px;
    line-height: 0.98;
    color: #F7F5F1;
    text-transform: uppercase;
    letter-spacing: -1px;
  }

  .headline .accent { color: #A49074; }

  .divider {
    position: absolute;
    left: 64px;
    bottom: 336px;
    width: 90px;
    height: 3px;
    background: #A49074;
  }

  .subtext {
    position: absolute;
    left: 64px;
    right: 120px;
    bottom: 250px;
    color: #D8D3C9;
    font-size: 27px;
    font-weight: 300;
    line-height: 1.45;
  }

  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 66px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.18);
    padding-top: 32px;
  }

  .footer img {
    height: 172px;
    opacity: 0.95;
  }

  .footer-right {
    text-align: right;
  }

  .footer-right .site {
    color: #F7F5F1;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .footer-right .creci {
    color: #8c8880;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="assets/bg-terrenos.jpg">
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>

    <div class="tag">
      <div class="dot"></div>
      <span>Blumenau Hill Residence &nbsp;·&nbsp; Blumenau/SC</span>
    </div>

    <div class="headline">Seu terreno.<br>Sua <span class="accent">história.</span></div>
    <div class="divider"></div>
    <div class="subtext">Condomínio fechado, cercado de natureza, a poucos minutos do centro de Blumenau.</div>

    <div class="footer">
      <img src="assets/logo-negativo-transparent-cropped.png">
      <div class="footer-right">
        <div class="site">rdamaia.com.br</div>
        <div class="creci">CRECI 06676 J</div>
      </div>
    </div>
  </div>
</body>
</html>
