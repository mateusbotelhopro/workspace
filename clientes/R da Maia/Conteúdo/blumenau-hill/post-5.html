<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0e0e0e;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 35%;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.55) 30%, rgba(10,10,10,0.88) 62%, #0e0e0e 100%);
  }

  .tag {
    position: absolute;
    top: 180px;
    left: 0; right: 0;
    text-align: center;
    color: #A49074;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .headline {
    position: absolute;
    top: 226px;
    left: 90px;
    right: 90px;
    text-align: center;
    font-family: 'Archivo Black', sans-serif;
    font-size: 68px;
    line-height: 1.08;
    color: #F7F5F1;
    text-transform: uppercase;
    letter-spacing: -0.5px;
  }

  .headline .accent { color: #A49074; }

  .subtext {
    position: absolute;
    top: 460px;
    left: 140px;
    right: 140px;
    text-align: center;
    color: #D8D3C9;
    font-size: 26px;
    font-weight: 300;
    line-height: 1.5;
  }

  .divider {
    position: absolute;
    top: 560px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 3px;
    background: #A49074;
  }

  .contact-block {
    position: absolute;
    top: 622px;
    left: 90px;
    right: 90px;
    background: rgba(247,245,241,0.06);
    border: 1px solid rgba(164,144,116,0.5);
    border-radius: 4px;
    padding: 46px 56px;
  }

  .phone-row {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 28px;
  }

  .phone-row:last-child { margin-bottom: 0; }

  .phone-row .icon-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #A49074;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .phone-row .icon-circle svg { width: 26px; height: 26px; }

  .phone-row .number {
    color: #F7F5F1;
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .cta-line {
    position: absolute;
    top: 868px;
    left: 0; right: 0;
    text-align: center;
    color: #A49074;
    font-size: 24px;
    font-weight: 500;
    font-style: italic;
  }

  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.18);
    padding-top: 28px;
  }

  .footer-left {
    color: #D8D3C9;
    font-size: 22px;
    font-weight: 300;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .footer-left .pin { color: #A49074; }

  .footer-right {
    text-align: right;
  }

  .footer-right .site {
    color: #F7F5F1;
    font-size: 22px;
    font-weight: 500;
  }

  .footer-right .creci {
    color: #8c8880;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-top: 5px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="assets/bg-portaria.jpg">
    <div class="overlay"></div>

    <div class="tag">Blumenau Hill Residence</div>
    <div class="headline">Vamos conversar<br>sobre o seu <span class="accent">terreno?</span></div>
    <div class="subtext">Condições, plantas, valores e disponibilidade de lotes. Fale direto com a Rdamaia.</div>
    <div class="divider"></div>

    <div class="contact-block">
      <div class="phone-row">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e0e" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        </div>
        <div class="number">(47) 98864-8604</div>
      </div>
      <div class="phone-row">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e0e0e" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        </div>
        <div class="number">(47) 99600-6227</div>
      </div>
    </div>

    <div class="cta-line">Ligue ou chame no WhatsApp agora mesmo.</div>

    <div class="footer">
      <div class="footer-left"><span class="pin">&#9679;</span> Blumenau/SC</div>
      <div class="footer-right">
        <div class="site">rdamaia.com.br</div>
        <div class="creci">CRECI 06676 J</div>
      </div>
    </div>
  </div>
</body>
</html>
