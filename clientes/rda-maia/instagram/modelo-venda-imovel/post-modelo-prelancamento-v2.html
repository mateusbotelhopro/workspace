<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #060606;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
    opacity: 0.85;
  }

  .color-grade {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(18,14,42,0.55) 0%, rgba(14,12,30,0.38) 28%, rgba(8,7,16,0.22) 50%, rgba(6,6,6,0.35) 100%);
    mix-blend-mode: multiply;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center 42%, rgba(6,6,6,0.2) 0%, rgba(6,6,6,0.62) 62%, rgba(6,6,6,0.9) 100%),
      linear-gradient(180deg, rgba(6,6,6,0.45) 0%, rgba(6,6,6,0.18) 22%, rgba(6,6,6,0.45) 55%, rgba(6,6,6,0.88) 100%);
  }

  .sparkle {
    position: absolute;
    color: #A49074;
    opacity: 0.85;
  }

  .sparkle.tr { top: 64px; right: 70px; font-size: 34px; }
  .sparkle.bl { bottom: 340px; left: 60px; font-size: 22px; opacity: 0.6; }

  .content {
    position: absolute;
    left: 0; right: 0;
    top: 130px;
    text-align: center;
  }

  .logo {
    height: 180px;
  }

  .logo-sub {
    margin-top: 6px;
    color: #A49074;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 10px;
    text-transform: uppercase;
  }

  .headline-block {
    margin-top: 130px;
  }

  .attention {
    font-family: 'Archivo Black', sans-serif;
    font-size: 108px;
    line-height: 1;
    color: #F7F5F1;
    letter-spacing: 2px;
  }

  .prelaunch {
    margin-top: 10px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 54px;
    letter-spacing: 6px;
    color: #A49074;
  }

  .divider {
    width: 80px;
    height: 2px;
    background: rgba(164,144,116,0.6);
    margin: 34px auto;
  }

  .subline {
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #A49074;
    text-transform: uppercase;
    padding: 0 60px;
    line-height: 1.35;
  }

  .cta-line {
    margin-top: 30px;
    display: inline-block;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #FFD23D;
    text-transform: uppercase;
    padding: 14px 34px;
    border: 3px solid #FFD23D;
    border-radius: 50px;
    background: rgba(0,0,0,0.28);
  }

  .contact-block {
    position: absolute;
    left: 0; right: 0;
    bottom: 110px;
    text-align: center;
  }

  .phone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .phone:last-child { margin-bottom: 0; }

  .phone .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #25D366;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .phone .icon svg { width: 21px; height: 21px; }

  .phone .number {
    color: #F7F5F1;
    font-size: 42px;
    font-weight: 500;
  }

  .footer {
    position: absolute;
    left: 0; right: 0;
    bottom: 40px;
    text-align: center;
    color: #6b6558;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="assets/grid-1.jpg">
    <div class="color-grade"></div>
    <div class="overlay"></div>

    <div class="sparkle tr">&#10022;</div>

    <div class="content">

  </div>
</body>
</html>
