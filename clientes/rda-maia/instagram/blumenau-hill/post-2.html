<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0e0e0e;
  }

  .photo-wrap {
    position: relative;
    width: 100%;
    height: 720px;
    overflow: hidden;
  }

  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 55%;
  }

  .photo-fade {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 220px;
    background: linear-gradient(to bottom, rgba(14,14,14,0) 0%, #0e0e0e 100%);
  }

  .black-block {
    position: absolute;
    top: 720px;
    left: 0; right: 0; bottom: 0;
    background: #0e0e0e;
    padding: 50px 64px 0 64px;
  }

  .tag {
    color: #A49074;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .headline {
    font-family: 'Archivo Black', sans-serif;
    font-size: 60px;
    line-height: 1.05;
    color: #F7F5F1;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    max-width: 820px;
  }

  .features {
    margin-top: 36px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 20px;
    column-gap: 40px;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .feature .icon {
    width: 40px;
    height: 40px;
    border: 1.5px solid #A49074;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .feature .icon svg { width: 20px; height: 20px; }

  .feature span {
    color: #E4E0D8;
    font-size: 24px;
    font-weight: 400;
  }

  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.18);
    padding-top: 28px;
  }

  .footer {
    justify-content: flex-end;
  }

  .footer-right {
    text-align: right;
  }

  .footer-right .site {
    color: #F7F5F1;
    font-size: 22px;
    font-weight: 500;
  }

  .footer-right .creci {
    color: #8c8880;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-top: 5px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="photo-wrap">
      <img src="assets/bg-piscina.jpg">
      <div class="photo-fade"></div>
    </div>

    <div class="black-block">
      <div class="tag">Blumenau Hill Residence</div>
      <div class="headline">Lazer completo pra toda família.</div>

      <div class="features">
        <div class="feature">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#A49074" stroke-width="1.8"><path d="M2 17c1.5 1.5 3 1.5 4.5 0s3-1.5 4.5 0 3 1.5 4.5 0 3-1.5 4.5 0"/><path d="M4 13V6a2 2 0 012-2h8l4 4v5"/></svg>
          </div>
          <span>Piscina adulto e infantil</span>
        </div>
        <div class="feature">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#A49074" stroke-width="1.8"><circle cx="12" cy="5" r="2"/><path d="M6 21l3-7 3 3 3-3 3 7"/><path d="M9 14l1-5 2 2 2-2 1 5"/></svg>
          </div>
          <span>Playground</span>
        </div>
        <div class="feature">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#A49074" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M12 6v12M3 12h18"/></svg>
          </div>
          <span>Quadra poliesportiva</span>
        </div>
        <div class="feature">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#A49074" stroke-width="1.8"><path d="M4 21V10a8 8 0 0116 0v11"/><path d="M4 21h16"/></svg>
          </div>
          <span>Salão de festas</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="footer-right">
        <div class="site">rdamaia.com.br</div>
        <div class="creci">CRECI 06676 J</div>
      </div>
    </div>
  </div>
</body>
</html>
