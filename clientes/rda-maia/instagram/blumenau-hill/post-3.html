<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0e0e0e;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
  }

  .frame {
    position: absolute;
    top: 40px; left: 40px; right: 40px; bottom: 40px;
    border: 1.5px solid rgba(164,144,116,0.85);
    pointer-events: none;
  }

  .fade-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 340px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0));
  }

  .fade-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 520px;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 55%, rgba(0,0,0,0.92) 100%);
  }

  .center-copy {
    position: absolute;
    left: 90px;
    right: 90px;
    bottom: 190px;
    text-align: center;
  }

  .headline {
    font-family: 'Archivo Black', sans-serif;
    font-size: 56px;
    line-height: 1.15;
    color: #F7F5F1;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .divider {
    width: 70px;
    height: 2px;
    background: #A49074;
    margin: 30px auto;
  }

  .tag {
    color: #A49074;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .footer {
    position: absolute;
    left: 90px;
    right: 90px;
    bottom: 76px;
    text-align: center;
  }

  .footer .site {
    color: #D8D3C9;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  .footer .creci {
    color: #7a7670;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="assets/bg-floresta.jpg">
    <div class="fade-top"></div>
    <div class="fade-bottom"></div>
    <div class="frame"></div>

    <div class="center-copy">
      <div class="headline">Morar cercado<br>de natureza.</div>
      <div class="divider"></div>
      <div class="tag">Blumenau Hill Residence</div>
    </div>

    <div class="footer">
      <div class="site">rdamaia.com.br</div>
      <div class="creci">CRECI 06676 J</div>
    </div>
  </div>
</body>
</html>
