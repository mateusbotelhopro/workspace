<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #03080f;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%;
  }

  .gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(3,10,18,0.30) 0%,
      rgba(3,10,18,0.05) 22%,
      rgba(3,10,18,0.10) 46%,
      rgba(3,10,18,0.72) 68%,
      rgba(2,7,13,0.96) 88%,
      rgba(2,7,13,1) 100%);
  }

  .top-bar {
    position: absolute;
    top: 56px;
    left: 56px;
    right: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(6,14,24,0.4);
    border: 1px solid rgba(240,168,53,0.55);
    border-radius: 40px;
    padding: 12px 24px 12px 18px;
  }

  .kicker .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #F0A835;
    flex-shrink: 0;
  }

  .kicker span {
    color: #FFFFFF;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .kicker span b {
    color: #F0A835;
  }

  .logo {
    height: 62px;
  }

  .content {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 96px;
  }

  .month-label {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #F0A835;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .price {
    font-family: 'Archivo Black', sans-serif;
    font-size: 118px;
    line-height: 0.95;
    color: #FFFFFF;
    letter-spacing: -1px;
  }

  .price-unit {
    font-size: 32px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
  }

  .subtitle {
    margin-top: 14px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
  }

  .rule {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.18);
    margin: 34px 0;
  }

  .evolution-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .arrow-badge {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(240,168,53,0.15);
    border: 2px solid #F0A835;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .evolution-text {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }

  .evolution-value {
    font-family: 'Archivo Black', sans-serif;
    font-size: 44px;
    color: #F0A835;
  }

  .evolution-desc {
    font-size: 21px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    left: 0; right: 0;
    bottom: 36px;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="assets/bg-balneario.jpg">
    <div class="gradient"></div>

    <div class="top-bar">
      <div class="kicker">
        <div class="dot"></div>
        <span>CUB <b>SANTA CATARINA</b></span>
      </div>
      <img class="logo" src="assets/logo-negativo-transparent-cropped.png">
    </div>

    <div class="content">
      <div class="month-label">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#F0A835" stroke-width="2"/><path d="M3 9H21" stroke="#F0A835" stroke-width="2"/><path d="M8 3V6" stroke="#F0A835" stroke-width="2" stroke-linecap="round"/><path d="M16 3V6" stroke="#F0A835" stroke-width="2" stroke-linecap="round"/></svg>
        Referência · Julho / 2026
      </div>

      <div class="price-row">
        <div class="price">R$ 3.121,62</div>
        <div class="price-unit">/ m²</div>
      </div>
      <div class="subtitle">Custo Unitário Básico · Residencial Médio (com desoneração)</div>

      <div class="rule"></div>

      <div class="evolution-row">
        <div class="arrow-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 16L14 6M14 6H7M14 6V13" stroke="#F0A835" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="evolution-text">
          <div class="evolution-value">+ 0,82%</div>
          <div class="evolution-desc">em relação a junho / 2026</div>
        </div>
      </div>
    </div>

    <div class="footer">CRECI 06676 J</div>
  </div>
</body>
</html>
