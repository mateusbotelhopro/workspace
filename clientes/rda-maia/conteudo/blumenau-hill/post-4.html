<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #F2EEE7;
  }

  .top {
    padding: 80px 64px 0 64px;
  }

  .tag {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
  }

  .tag .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #A49074;
  }

  .tag span {
    color: #6b6558;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .headline {
    font-family: 'Archivo Black', sans-serif;
    font-size: 76px;
    line-height: 0.98;
    color: #0e0e0e;
    text-transform: uppercase;
    letter-spacing: -1px;
  }

  .headline .accent { color: #A49074; }

  .subtext {
    margin-top: 22px;
    color: #4a463d;
    font-size: 25px;
    font-weight: 300;
    max-width: 760px;
    line-height: 1.5;
  }

  .plan-card {
    position: absolute;
    top: 480px;
    left: 64px;
    right: 64px;
    height: 590px;
    background: #ffffff;
    border: 1.5px solid rgba(164,144,116,0.6);
    box-shadow: 0 30px 60px -20px rgba(14,14,14,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
  }

  .plan-card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .plan-caption {
    position: absolute;
    top: 1094px;
    left: 64px;
    right: 64px;
    text-align: center;
    color: #8c8880;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 66px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    border-top: 1px solid rgba(14,14,14,0.14);
    padding-top: 32px;
  }

  .footer-right {
    text-align: right;
  }

  .footer-right .site {
    color: #0e0e0e;
    font-size: 24px;
    font-weight: 500;
  }

  .footer-right .creci {
    color: #8c8880;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 1px;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <div class="tag"><div class="dot"></div><span>Blumenau Hill Residence</span></div>
      <div class="headline">Escolha<br>o seu <span class="accent">lote.</span></div>
      <div class="subtext">Terrenos de diferentes metragens em condomínio fechado. Confira a planta e garanta o seu antes do lançamento.</div>
    </div>

    <div class="plan-card">
      <img src="assets/planta.jpg">
    </div>
    <div class="plan-caption">Planta do condomínio · Blumenau Hill Residence</div>

    <div class="footer">
      <div class="footer-right">
        <div class="site">rdamaia.com.br</div>
        <div class="creci">CRECI 06676 J</div>
      </div>
    </div>
  </div>
</body>
</html>
