<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #0B0C0E;
  }

  .photo {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 860px;
    overflow: hidden;
  }

  .photo .bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
  }

  .photo-scrim-top {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(2,7,13,0.55) 0%, rgba(2,7,13,0) 26%, rgba(2,7,13,0) 78%, rgba(2,7,13,0.5) 100%);
  }

  .top-row {
    position: absolute;
    top: 52px;
    left: 56px;
    right: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    height: 50px;
  }

  .kicker {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(6,14,24,0.45);
    border: 1px solid rgba(240,168,53,0.55);
    border-radius: 40px;
    padding: 10px 20px 10px 16px;
  }

  .kicker .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #F0A835;
    flex-shrink: 0;
  }

  .kicker span {
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .location-tag {
    position: absolute;
    left: 56px;
    bottom: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.85);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .panel {
    position: absolute;
    top: 860px;
    left: 0; right: 0; bottom: 0;
    border-top: 3px solid #F0A835;
    padding: 54px 64px 0 64px;
  }

  .eyebrow {
    color: #F0A835;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .main-row {
    margin-top: 34px;
    display: flex;
    align-items: stretch;
  }

  .price-col {
    flex: 1.7;
  }

  .price {
    font-family: 'Archivo Black', sans-serif;
    font-size: 68px;
    line-height: 0.95;
    color: #FFFFFF;
    letter-spacing: -1px;
    white-space: nowrap;
  }

  .price-sub {
    margin-top: 12px;
    font-size: 21px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .divider-v {
    width: 1px;
    background: rgba(255,255,255,0.18);
    margin: 6px 44px;
  }

  .stat-col {
    flex: 1.1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .stat-value {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 52px;
    color: #F0A835;
  }

  .arrow-badge {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(240,168,53,0.15);
    border: 2px solid #F0A835;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stat-label {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 26px;
    color: rgba(255,255,255,0.45);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="photo">
      <img class="bg" src="assets/bg-vila-germanica.jpg" alt="Vila Germânica, Blumenau/SC">
      <div class="photo-scrim-top"></div>
      <div class="top-row">
        <img class="logo" src="assets/logo-negativo-transparent-cropped.png" alt="R da Maia">
        <div class="kicker">
          <div class="dot"></div>
          <span>CUB <b>/ SC</b></span>
        </div>
      </div>
      <div class="location-tag">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-7.58 7-13A7 7 0 0 0 5 9c0 5.42 7 13 7 13Z" stroke="#F0A835" stroke-width="2"/><circle cx="12" cy="9" r="2.5" stroke="#F0A835" stroke-width="2"/></svg>
        Vila Germânica · Blumenau/SC
      </div>
    </div>

    <div class="panel">
      <div class="eyebrow">Referência · Julho / 2026</div>

      <div class="main-row">
        <div class="price-col">
          <div class="price">R$ 3.121,62</div>
          <div class="price-sub">Custo unitário básico / m² · residencial médio</div>
        </div>
        <div class="divider-v"></div>
        <div class="stat-col">
          <div class="stat-value">
            <div class="arrow-badge">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 16L14 6M14 6H7M14 6V13" stroke="#F0A835" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            0,82%
          </div>
          <div class="stat-label">Variação em relação<br>a junho / 2026</div>
        </div>
      </div>

      <div class="footer">
        <span>rdamaia.com.br</span>
        <span>(47) 98864-7604</span>
        <span>CRECI 06676 J</span>
      </div>
    </div>
  </div>
</body>
</html>
