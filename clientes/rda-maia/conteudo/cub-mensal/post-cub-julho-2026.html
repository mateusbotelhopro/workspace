<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; font-family: 'Montserrat', sans-serif; }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #03080f;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    filter: saturate(1.0) contrast(1.02);
  }

  .gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(2,7,13,0.66) 0%,
      rgba(2,7,13,0.42) 18%,
      rgba(2,7,13,0.46) 40%,
      rgba(2,7,13,0.62) 58%,
      rgba(2,7,13,0.90) 78%,
      rgba(2,7,13,0.98) 100%);
  }

  .frame {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo {
    height: 72px;
    margin-top: 84px;
  }

  .cub-title {
    margin-top: 56px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 150px;
    line-height: 0.9;
    color: #FFFFFF;
    letter-spacing: 1px;
  }

  .state {
    margin-top: 6px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 68px;
    line-height: 1;
    color: #F0A835;
    letter-spacing: 1px;
  }

  .month {
    margin-top: 24px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 9px;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
  }

  .rule {
    margin-top: 56px;
    width: 130px;
    height: 3px;
    background: #F0A835;
    border-radius: 2px;
  }

  .price-row {
    margin-top: 44px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .price {
    font-family: 'Archivo Black', sans-serif;
    font-size: 92px;
    color: #FFFFFF;
    letter-spacing: -0.5px;
  }

  .price-unit {
    font-size: 32px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
  }

  .stats-row {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .stat-value {
    font-family: 'Archivo Black', sans-serif;
    font-size: 54px;
    color: #F0A835;
  }

  .stat-label {
    margin-top: 8px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    line-height: 1.35;
  }

  .divider-v {
    width: 1px;
    height: 72px;
    background: rgba(255,255,255,0.25);
  }

  .stat-value--sm {
    font-size: 33px;
    margin-top: 10px;
  }

  .footer {
    margin-top: auto;
    margin-bottom: 46px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: rgba(255,255,255,0.65);
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .footer .sep {
    color: rgba(240,168,53,0.6);
  }
</style>
</head>
<body>
  <div class="canvas">
    <img class="bg" src="assets/bg-vila-germanica.jpg" alt="Vila Germânica, Blumenau/SC">
    <div class="gradient"></div>

    <div class="frame">
      <img class="logo" src="assets/logo-negativo-transparent-cropped.png" alt="R da Maia">

      <div class="cub-title">CUB</div>
      <div class="state">SANTA CATARINA</div>
      <div class="month">Julho 2026</div>

      <div class="rule"></div>

      <div class="price-row">
        <div class="price">R$ 3.121,62</div>
        <div class="price-unit">/ m²</div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-value">+ 0,82%</div>
          <div class="stat-label">Variação<br>ao mês</div>
        </div>
        <div class="divider-v"></div>
        <div class="stat">
          <div class="stat-value stat-value--sm">Residencial</div>
          <div class="stat-label">Médio (com<br>desoneração)</div>
        </div>
      </div>

      <div class="footer">
        <span>rdamaia.com.br</span>
        <span class="sep">·</span>
        <span>(47) 98864-8604</span>
        <span class="sep">·</span>
        <span>(47) 99600-6227</span>
      </div>
    </div>
  </div>
</body>
</html>
