  <style>
    /* ---- Reset de overflow para esta página ---- */
    body { overflow: hidden; }

    /* ---- Layout principal ---- */
    .ty-page {
      min-height: 100vh;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Fundo com ambient glow */
    .ty-page::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 900px; height: 520px;
      background: radial-gradient(ellipse, rgba(141,157,179,0.09) 0%, transparent 62%);
      pointer-events: none;
    }
    /* Linha superior de borda decorativa */
    .ty-page::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, rgba(141,157,179,0.4) 70%, transparent 100%);
    }

    /* Logo no topo */
    .ty-logo {
      position: absolute;
      top: 32px; left: 50%;
      transform: translateX(-50%);
      animation: fadeDown 0.7s ease 0.1s both;
    }
    .ty-logo img { height: 34px; width: auto; }

    /* Conteúdo central */
    .ty-inner {
      position: relative;
      z-index: 2;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Ícone de sucesso */
    .ty-icon-wrap {
      width: 84px; height: 84px;
      border-radius: 50%;
      border: 1.5px solid rgba(141,157,179,0.3);
      background: rgba(141,157,179,0.07);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 36px;
      animation: iconPop 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.35s both;
    }
    .ty-icon-wrap svg {
      width: 36px; height: 36px;
      color: var(--accent);
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.5s ease 0.85s forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Eyebrow */
    .ty-eyebrow {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      animation: fadeUp 0.7s ease 0.5s both;
    }

    /* Linha divisória */
    .ty-rule {
      width: 40px; height: 1px;
      background: var(--accent);
      margin: 0 auto 22px;
      animation: fadeUp 0.7s ease 0.55s both;
    }

    /* Título */
    .ty-title {
      font-family: var(--font-serif);
      font-size: clamp(36px, 6vw, 60px);
      font-weight: 700;
      color: var(--light);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 20px;
      animation: fadeUp 0.8s ease 0.58s both;
    }

    /* Subtítulo */
    .ty-text {
      font-size: 15px;
      font-weight: 300;
      color: rgba(237,243,248,0.62);
      line-height: 1.85;
      max-width: 420px;
      margin: 0 auto 48px;
      animation: fadeUp 0.8s ease 0.70s both;
    }

    /* CTAs */
    .ty-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 0.8s ease 0.80s both;
    }

    /* Rodapé */
    .ty-footer {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: rgba(237,243,248,0.28);
      letter-spacing: 0.04em;
      animation: fadeUp 0.6s ease 1s both;
    }

    /* Animações */
    @keyframes iconPop {
      from { opacity: 0; transform: scale(0.65); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Responsivo */
    @media (max-width: 480px) {
      .ty-actions { flex-direction: column; align-items: center; }
      .ty-actions .btn-arrow { width: 100%; justify-content: center; }
    }
  </style>
