<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 800px;
    height: 800px;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .canvas {
    position: relative;
    width: 800px;
    height: 800px;
    background:
      radial-gradient(circle at 50% 42%, rgba(0,201,167,0.20) 0%, rgba(0,201,167,0) 60%),
      linear-gradient(160deg, #0d211d 0%, #0a1815 100%);
    overflow: hidden;
  }

  /* faint concentric ring echoing the LinkedIn circular crop */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(126,238,221,0.14);
  }
  .ring.r1 { width: 720px; height: 720px; left: 40px; top: 40px; }
  .ring.r2 { width: 600px; height: 600px; left: 100px; top: 100px; border-color: rgba(126,238,221,0.09); }

  .glow {
    position: absolute;
    width: 420px;
    height: 420px;
    left: 190px;
    top: 175px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,201,167,0.30) 0%, rgba(0,201,167,0) 70%);
    filter: blur(2px);
  }

  .mark {
    position: absolute;
    left: 50%;
    top: 47%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 360px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="glow"></div>

    <svg class="mark" viewBox="0 0 34 44" fill="none">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7eeedd"/>
          <stop offset="100%" stop-color="#00c9a7"/>
        </linearGradient>
      </defs>
      <circle cx="17" cy="7" r="4.6" fill="url(#g)"/>
      <polyline points="4,16 17,40 30,16" stroke="url(#g)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
</body>
</html>
