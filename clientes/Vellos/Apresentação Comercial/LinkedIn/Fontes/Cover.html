<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: local('Inter');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  .canvas {
    position: relative;
    width: 1584px;
    height: 396px;
    background:
      radial-gradient(circle at 78% 50%, rgba(0,201,167,0.16) 0%, rgba(0,201,167,0) 45%),
      linear-gradient(120deg, #0a1815 0%, #0d1f1c 55%, #0c211d 100%);
    overflow: hidden;
  }

  /* subtle grid texture */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(126,238,221,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(126,238,221,0.05) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.05) 75%);
  }

  /* pipeline / funnel graphic on the right */
  .pipeline {
    position: absolute;
    right: -40px;
    top: 0;
    height: 396px;
    width: 760px;
  }
  .node {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #7eeedd 0%, #00c9a7 60%, #00a98e 100%);
    box-shadow: 0 0 28px rgba(0,201,167,0.55);
  }
  .node.dim {
    background: radial-gradient(circle at 35% 35%, rgba(126,238,221,0.55) 0%, rgba(0,201,167,0.35) 60%, rgba(0,169,142,0.25) 100%);
    box-shadow: 0 0 16px rgba(0,201,167,0.25);
  }
  .link {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, rgba(126,238,221,0.05), rgba(126,238,221,0.55));
    transform-origin: left center;
  }

  .content {
    position: absolute;
    left: 96px;
    top: 0;
    height: 396px;
    width: 760px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .logo-mark {
    width: 34px;
    height: 44px;
    display: block;
  }
  .logo-text {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #f5faf9;
  }
  .logo-text .dot { color: #00c9a7; }

  .tagline {
    font-size: 44px;
    font-weight: 800;
    line-height: 1.18;
    color: #f5faf9;
    max-width: 660px;
    letter-spacing: -0.5px;
  }
  .tagline .accent { color: #00c9a7; }

  .subline {
    margin-top: 22px;
    font-size: 21px;
    font-weight: 400;
    color: #bcd9d2;
    max-width: 580px;
    line-height: 1.5;
  }

  .divider {
    margin-top: 30px;
    height: 3px;
    width: 88px;
    border-radius: 2px;
    background: linear-gradient(90deg, #00c9a7, #7eeedd);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid"></div>

    <!-- Pipeline / network visual -->
    <div class="pipeline" id="pipeline"></div>

    <div class="content">
      <div class="logo-row">
        <svg class="logo-mark" viewBox="0 0 34 44" fill="none">
          <circle cx="17" cy="7" r="4" fill="#00c9a7"/>
          <polyline points="5,16 17,38 29,16" stroke="#00c9a7" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span class="logo-text">VELLOS<span class="dot">.</span></span>
      </div>

      <div class="tagline">Sua agenda cheia de <span class="accent">reuniões qualificadas</span> com decisores B2B</div>

      <div class="subline">BPO de SDR: prospecção outbound multicanal, qualificação e geração de pipeline previsível para o seu time comercial.</div>

      <div class="divider"></div>
    </div>
  </div>

<script>
  // Build a pipeline/funnel network graphic procedurally
  const wrap = document.getElementById('pipeline');
  const W = 760, H = 396;

  // Define 3 stages (columns) funneling left -> right, like a sales pipeline narrowing then converting
  const stages = [
    { x: 90,  ys: [60, 150, 240, 330], r: 9,  dim: true  },
    { x: 360, ys: [110, 200, 290],     r: 12, dim: true  },
    { x: 640, ys: [165, 235],          r: 17, dim: false }
  ];

  const nodes = [];
  stages.forEach((stage, si) => {
    stage.ys.forEach((y, ni) => {
      const node = document.createElement('div');
      node.className = 'node' + (stage.dim ? ' dim' : '');
      const d = stage.r * 2;
      node.style.width = d + 'px';
      node.style.height = d + 'px';
      node.style.left = (stage.x - stage.r) + 'px';
      node.style.top = (y - stage.r) + 'px';
      wrap.appendChild(node);
      nodes.push({ x: stage.x, y, si });
    });
  });

  // connect each node in stage i to nearest 1-2 nodes in stage i+1
  for (let si = 0; si < stages.length - 1; si++) {
    const from = nodes.filter(n => n.si === si);
    const to = nodes.filter(n => n.si === si + 1);
    from.forEach(a => {
      const sorted = [...to].sort((p, q) => Math.abs(p.y - a.y) - Math.abs(q.y - a.y));
      sorted.slice(0, 2).forEach(b => {
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        const link = document.createElement('div');
        link.className = 'link';
        link.style.width = len + 'px';
        link.style.left = a.x + 'px';
        link.style.top = a.y + 'px';
        link.style.transform = `rotate(${angle}deg)`;
        wrap.appendChild(link);
      });
    });
  }
</script>
</body>
</html>
