<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="YOU Piercing - Clínica & Joalheria em Blumenau/SC. Agende sua perfuração, veja avaliações, catálogo de serviços e nossa formação presencial.">
<meta name="theme-color" content="#C2185B">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>YOU Piercing | Clínica & Joalheria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --pink:        #C2185B;
    --pink-dark:   #8E1248;
    --pink-soft:   #FBD7E6;
    --text:        #262626;
    --muted:       #767676;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: 'Poppins', system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 8%, #ffb199 0%, transparent 40%),
      radial-gradient(circle at 88% 4%, #c084fc 0%, transparent 38%),
      radial-gradient(circle at 92% 95%, #ff6fa5 0%, transparent 42%),
      radial-gradient(circle at 6% 92%, #ffd166 0%, transparent 38%),
      #ffffff;
    display: flex;
    justify-content: center;
    padding: 28px 14px 50px;
  }

  .page {
    width: 100%;
    max-width: 460px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(142, 18, 72, 0.18);
    overflow: hidden;
    padding-bottom: 28px;
  }

  /* ---- Logo card ---- */
  .logo-card {
    background: linear-gradient(160deg, var(--pink) 0%, var(--pink-dark) 100%);
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .logo-card .sparkle {
    position: absolute;
    color: rgba(255, 255, 255, 0.55);
    font-size: 18px;
  }
  .logo-card .sparkle.s1 { top: 24%; left: 20%; font-size: 14px; }
  .logo-card .sparkle.s2 { top: 30%; right: 18%; font-size: 22px; }
  .logo-card .sparkle.s3 { bottom: 28%; left: 28%; font-size: 10px; }

  .logo-card .wordmark {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    color: #ffffff;
    font-size: clamp(34px, 9vw, 46px);
    letter-spacing: 0.5px;
  }

  .logo-card .tagline {
    margin-top: 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.85);
  }

  /* ---- Headline ---- */
  .intro {
    padding: 22px 26px 6px;
  }

  .intro h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.3;
    color: var(--text);
  }

  .intro h1 span {
    color: var(--pink);
  }

  .intro p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.55;
  }

  /* ---- Links ---- */
  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 22px 22px 0;
  }

  .link-card {
    display: block;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(142, 18, 72, 0.16);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 10px 26px rgba(142, 18, 72, 0.28);
  }

  .link-card img {
    display: block;
    width: 100%;
    height: auto;
  }

  footer {
    text-align: center;
    margin-top: 26px;
    font-size: 11px;
    color: #c2c2c2;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="logo-card">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✦</span>
      <span class="sparkle s3">✦</span>
      <div class="wordmark">YOU Piercing</div>
      <div class="tagline">CLÍNICA &amp; JOALHERIA</div>
    </div>

    <div class="intro">
      <h1>Seja <span>YOULOVER</span> também</h1>
      <p>Agende seu momento na melhor clínica de piercing em Blumenau SC!</p>
    </div>

    <div class="links">
      <a class="link-card" href="https://wa.me/message/TTI7EOWDN2KJG1" target="_blank" rel="noopener">
        <img src="img/link-1-agende.png" alt="Agende na You" loading="lazy">
      </a>

      <a class="link-card" href="https://maps.app.goo.gl/yRtvKETYHhrRkky76?g_st=ic" target="_blank" rel="noopener">
        <img src="img/link-2-avaliacoes.png" alt="Avaliações no Google" loading="lazy">
      </a>

      <a class="link-card" href="https://drive.google.com/file/d/1J1hh65o_Ybi_u02DLmd3mmEAp1N1aT84/view?usp=drivesdk" target="_blank" rel="noopener">
        <img src="img/link-3-catalogo.png" alt="Catálogo de Serviços" loading="lazy">
      </a>

      <a class="link-card" href="https://wa.me/message/HWGLT2DQLRKGP1" target="_blank" rel="noopener">
        <img src="img/link-4-formacao.png" alt="Formação Presencial" loading="lazy">
      </a>

      <a class="link-card" href="https://maps.app.goo.gl/yRtvKETYHhrRkky76?g_st=ic" target="_blank" rel="noopener">
        <img src="img/link-5-localizacao.png" alt="Localização da Clínica" loading="lazy">
      </a>
    </div>

    <footer>&copy; 2026 Eduarda Souza Academy</footer>
  </div>
</body>
</html>
